[project]
name = "rotating-shield-estimation-orchestrator"
version = "0.1.0"
description = "Reproducible same-log pure-PF and pure-MLE benchmarking for rotating-shield estimation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rotating Shield Research Team"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "psutil>=6,<8",
]

[project.scripts]
rotating-shield-orchestrator = "orchestrator.cli:main"
rse-orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"src/orchestrator/contracts/measurement_log_schema.json" = "orchestrator/contracts/measurement_log_schema.json"
"src/orchestrator/contracts/forward_model_manifest_schema.json" = "orchestrator/contracts/forward_model_manifest_schema.json"
"src/orchestrator/contracts/pf_result_schema.json" = "orchestrator/contracts/pf_result_schema.json"
"src/orchestrator/contracts/mle_result_schema.json" = "orchestrator/contracts/mle_result_schema.json"
"src/orchestrator/contracts/mle_snapshot_schema.json" = "orchestrator/contracts/mle_snapshot_schema.json"
"src/orchestrator/contracts/mle_snapshot_v2_schema.json" = "orchestrator/contracts/mle_snapshot_v2_schema.json"
"src/orchestrator/contracts/pf_directive_schema.json" = "orchestrator/contracts/pf_directive_schema.json"
"src/orchestrator/contracts/pf_directive_receipt_schema.json" = "orchestrator/contracts/pf_directive_receipt_schema.json"
"src/orchestrator/contracts/hybrid_ledger_summary_schema.json" = "orchestrator/contracts/hybrid_ledger_summary_schema.json"
"src/orchestrator/contracts/hybrid_result_schema.json" = "orchestrator/contracts/hybrid_result_schema.json"
"src/orchestrator/contracts/future_candidate_score_schema.json" = "orchestrator/contracts/future_candidate_score_schema.json"
"src/orchestrator/contracts/hybrid_planning_request_schema.json" = "orchestrator/contracts/hybrid_planning_request_schema.json"
"src/orchestrator/contracts/hybrid_planning_recommendation_schema.json" = "orchestrator/contracts/hybrid_planning_recommendation_schema.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
